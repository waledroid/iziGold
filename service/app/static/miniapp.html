<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>XAUUSD — Live</title>
<script src="/static/vendor/lightweight-charts.standalone.production.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js" defer></script>
<style>
:root {
  --bg: #0a0e14;
  --bg-panel: #10151f;
  --border: rgba(255, 255, 255, 0.08);
  --text-main: #e7ecf3;
  --text-muted: #8a94a6;
  --up: #26a69a;
  --down: #ef5350;
  --accent: #f5c542;
  --neutral-line: #9aa5b8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  overflow: hidden;
}
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text-main);
  display: flex;
  flex-direction: column;
  font-variant-numeric: tabular-nums;
}

/* Header */
#header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  flex: 0 0 auto;
}
#symbol {
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.02em;
}
#dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--down);
  flex: 0 0 auto;
  box-shadow: 0 0 6px 0 currentColor;
}
#dot.online { background: var(--up); }
#priceRow {
  display: flex;
  gap: 10px;
  margin-left: auto;
  font-size: 13px;
  color: var(--text-muted);
  flex-wrap: wrap;
  justify-content: flex-end;
}
#priceRow .val { color: var(--text-main); font-weight: 600; }
#priceRow .lbl { color: var(--text-muted); margin-right: 2px; }

/* Tab bar (Chart | Trades) */
#tabBar {
  display: flex;
  gap: 0;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  flex: 0 0 auto;
}
.tab-btn {
  flex: 1 1 0;
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-muted);
  padding: 8px 6px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.tab-btn.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}
.panel {
  display: none;
  flex: 1 1 auto;
  min-height: 0;
  flex-direction: column;
}
.panel.active { display: flex; }

/* Trades report */
#tradesPanel { background: var(--bg); }
#repHead {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  flex: 0 0 auto;
  flex-wrap: wrap;
}
#repHead .rep-title {
  font-weight: 700;
  font-size: 14px;
  flex: 1 1 auto;
  text-align: center;
  white-space: nowrap;
}
.rep-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-main);
  padding: 4px 9px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  flex: 0 0 auto;
}
.rep-btn:disabled { opacity: 0.35; cursor: default; }
#repActions {
  display: flex;
  gap: 6px;
  padding: 6px 10px 0;
  flex: 0 0 auto;
  align-items: center;
}
#repActions .spacer { flex: 1 1 auto; }
#repSpark { height: 34px; width: 120px; flex: 0 0 auto; }
#repSpark polyline { fill: none; stroke: var(--accent); stroke-width: 1.5; }
#repBody {
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
  padding: 6px 10px 12px;
  -webkit-overflow-scrolling: touch;
}
table.rep {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  white-space: nowrap;
}
table.rep th, table.rep td {
  padding: 6px 6px;
  border-bottom: 1px solid var(--border);
  text-align: right;
}
table.rep th {
  color: var(--text-muted);
  font-weight: 600;
  font-size: 11px;
  position: sticky;
  top: 0;
  background: var(--bg);
}
table.rep th:first-child, table.rep td:first-child { text-align: left; }
table.rep td.l { text-align: left; }
table.rep tr.day-row { cursor: pointer; }
table.rep tr.day-row:active { background: rgba(255,255,255,0.05); }
.pos { color: var(--up); }
.neg { color: var(--down); }
.dir-buy { color: var(--up); font-weight: 700; }
.dir-sell { color: var(--down); font-weight: 700; }
.muted { color: var(--text-muted); }
#repFoot {
  margin-top: 8px;
  padding: 8px 10px;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 12px;
  line-height: 1.7;
}
#repFoot .k { color: var(--text-muted); margin-right: 4px; }
#repStatus {
  padding: 18px 10px;
  color: var(--text-muted);
  font-size: 13px;
  text-align: center;
}
#toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  background: rgba(16, 21, 31, 0.95);
  border: 1px solid var(--border);
  color: var(--text-main);
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 12px;
  display: none;
  z-index: 20;
}
#toast.visible { display: block; }

/* TF buttons */
#tfRow {
  display: flex;
  gap: 6px;
  padding: 6px 10px;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  flex: 0 0 auto;
  overflow-x: auto;
}
.tf-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-muted);
  padding: 5px 11px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  flex: 0 0 auto;
}
.tf-btn.active {
  color: #0a0e14;
  background: var(--accent);
  border-color: var(--accent);
}

/* Chart */
#chartWrap {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
}
#chart {
  position: absolute;
  inset: 0;
}

/* Indicator legend */
#legend {
  position: absolute;
  top: 8px;
  left: 8px;
  z-index: 3;
  background: rgba(16, 21, 31, 0.72);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 8px;
  font-size: 11px;
  line-height: 1.6;
  color: var(--text-main);
  pointer-events: none;
  user-select: none;
}
#legend .legend-row {
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
#legend .legend-swatch {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 2px;
  flex: 0 0 auto;
}
#legend .legend-ht {
  background: linear-gradient(90deg, #1e90ff 50%, #ff4500 50%);
}

/* Position card */
#posCard {
  position: absolute;
  left: 10px;
  bottom: 10px;
  background: rgba(16, 21, 31, 0.92);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 12px;
  min-width: 170px;
  backdrop-filter: blur(4px);
  display: none;
}
#posCard.visible { display: block; }
#posCard .row {
  display: flex;
  justify-content: space-between;
  gap: 14px;
  padding: 1px 0;
}
#posCard .dir-buy { color: var(--up); font-weight: 700; }
#posCard .dir-sell { color: var(--down); font-weight: 700; }
#posCard .profit-pos { color: var(--up); }
#posCard .profit-neg { color: var(--down); }

/* Offline banner */
#offlineBanner {
  display: none;
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  background: var(--down);
  color: #fff;
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  padding: 6px 8px;
  z-index: 5;
}
#offlineBanner.visible { display: block; }
</style>
</head>
<body>

<div id="header">
  <span id="dot"></span>
  <span id="symbol">XAUUSD</span>
  <div id="priceRow">
    <span><span class="lbl">Bid</span><span class="val" id="bidVal">—</span></span>
    <span><span class="lbl">Ask</span><span class="val" id="askVal">—</span></span>
    <span><span class="lbl">Spread</span><span class="val" id="spreadVal">—</span></span>
  </div>
</div>

<div id="tabBar">
  <button class="tab-btn active" data-tab="chart" id="tabChart">📈 Chart</button>
  <button class="tab-btn" data-tab="trades" id="tabTrades">📋 Trades</button>
</div>

<div id="chartPanel" class="panel active">
<div id="tfRow"></div>

<div id="chartWrap">
  <div id="offlineBanner">Connection lost — reconnecting…</div>
  <div id="chart"></div>
  <div id="legend">
    <div class="legend-row"><span class="legend-swatch legend-ht"></span>HalfTrend</div>
    <div class="legend-row"><span class="legend-swatch" style="background:#888888"></span>EMA 9</div>
    <div class="legend-row"><span class="legend-swatch" style="background:#888888"></span>EMA 21</div>
    <div class="legend-row"><span class="legend-swatch" style="background:#f5c542"></span>EMA 55</div>
    <div class="legend-row"><span class="legend-swatch" style="background:mediumpurple"></span>EMA 200</div>
  </div>
  <div id="posCard"></div>
</div>
</div>

<div id="tradesPanel" class="panel">
  <div id="repHead">
    <button class="rep-btn" id="repBack" style="display:none">← Back</button>
    <button class="rep-btn" id="repPrev">‹</button>
    <span class="rep-title" id="repTitle">—</span>
    <button class="rep-btn" id="repNext">›</button>
  </div>
  <div id="repActions">
    <button class="rep-btn" id="repCsv">⬇ CSV</button>
    <button class="rep-btn" id="repCopy">Copy CSV</button>
    <span class="spacer"></span>
    <svg id="repSpark" viewBox="0 0 120 34" preserveAspectRatio="none" aria-hidden="true"></svg>
  </div>
  <div id="repBody">
    <div id="repStatus">Loading…</div>
    <table class="rep" id="repTable" style="display:none"><thead></thead><tbody></tbody></table>
    <div id="repFoot" style="display:none"></div>
  </div>
</div>
<div id="toast"></div>

<script>
(function () {
  "use strict";

  var DEFAULT_TFS = ["M1", "M5", "M15", "M30", "H1", "H4", "D1"];
  var OFFLINE_TIMEOUT_MS = 10000;
  var RECONNECT_STEPS_MS = [1000, 2000, 5000];

  // ---- Telegram WebApp bridge (optional, feature-detected) ----------
  // telegram-web-app.js is loaded with `defer`, so it has NOT necessarily
  // run yet at the point this script's top-level code executes (this
  // inline script is itself not deferred, so the parser reaches it
  // mid-document). Every use site reads window.Telegram lazily through
  // tg() instead of capturing it once into a variable; anything that
  // actually needs the object populated (ready/expand, initial theme
  // colors, initData) runs from boot(), which only fires once the whole
  // document — including deferred scripts, per spec — has parsed.
  function tg() {
    return (window.Telegram && window.Telegram.WebApp) || null;
  }

  function withInitData(url) {
    var t = tg();
    var initData = t ? (t.initData || "") : "";
    if (!initData) return url;
    var sep = url.indexOf("?") === -1 ? "?" : "&";
    return url + sep + "initData=" + encodeURIComponent(initData);
  }

  // ---- Theme (Telegram themeParams when available) -------------------
  function themeColors() {
    var t = tg();
    var tp = (t && t.themeParams) ? t.themeParams : {};
    return {
      bg: tp.bg_color || "#0a0e14",
      text: tp.text_color || "#e7ecf3",
      grid: "rgba(255,255,255,0.06)",
      border: tp.hint_color || "rgba(255,255,255,0.15)"
    };
  }

  // ---- Chart setup (created in boot(), once the DOM + deferred scripts
  // have loaded) ------------------------------------------------------------
  var chartWrap, chartEl, chart, series;
  var tfRow, bidEl, askEl, spreadEl, posCard, dot, offlineBanner;

  // ---- Indicator overlays (EMA 9/21/55/200 + HalfTrend) ------------------
  // Server-computed (app/indicators.py, the exact EA-math port) on every
  // /api/history response; advanced client-side between server refreshes
  // for the live EMA lines. Added to the chart BEFORE the candlestick
  // series (in boot()) so candles paint on top, matching render.py's PNG
  // zorder (overlays under the OHLC bars).
  var ema9Series, ema21Series, ema55Series, ema200Series;
  var htSeries;
  // HalfTrend renders as ONE continuous line with per-point color (Lightweight
  // Charts v4 LineData supports a `color` field per point) so it flips blue
  // <-> red at trend changes exactly like the MT5 indicator, instead of two
  // series with whitespace gaps at every flip.
  var HT_UP_COLOR = "#1e90ff";   // dodgerblue -- trend 0
  var HT_DOWN_COLOR = "#ff4500"; // orangered  -- trend 1
  // Baseline for the live EMA recurrence: the EMA value AT the last
  // CLOSED bar (server truth), i.e. index length-2 of the just-fetched
  // history (index length-1 is the still-forming bar). Reset on every
  // successful loadHistory(); consumed by advanceEma() as ticks arrive
  // for the still-forming bar between refreshes.
  var emaPrev = { e9: null, e21: null, e55: null, e200: null };
  var emaK = { e9: 2 / 10, e21: 2 / 22, e55: 2 / 56, e200: 2 / 201 };
  var lastBarT = null;

  function arrAt(arr, i) {
    return (Array.isArray(arr) && i >= 0 && i < arr.length) ? arr[i] : null;
  }

  // Builds per-series point arrays aligned to `times` (the SAME time
  // values used for the candlestick series) via idxMap[i] -> the row's
  // original index in body.candles, so a client-side isValidCandle()
  // filter can never desync overlays from the candle series. Missing/short
  // indicator arrays (old server) degrade to "no points for that series"
  // -- overlays just don't draw, the candle chart still works.
  function setIndicatorSeriesData(body, idxMap, times) {
    var e9 = [], e21 = [], e55 = [], e200 = [], ht = [];
    for (var i = 0; i < idxMap.length; i++) {
      var orig = idxMap[i], t = times[i];
      var v9 = arrAt(body.ema9, orig);
      if (isNumeric(v9)) e9.push({ time: t, value: v9 });
      var v21 = arrAt(body.ema21, orig);
      if (isNumeric(v21)) e21.push({ time: t, value: v21 });
      var v55 = arrAt(body.ema55, orig);
      if (isNumeric(v55)) e55.push({ time: t, value: v55 });
      var v200 = arrAt(body.ema200, orig);
      if (isNumeric(v200)) e200.push({ time: t, value: v200 });
      var htPt = arrAt(body.halftrend, orig);
      if (htPt && isNumeric(htPt.v) && (htPt.trend === 0 || htPt.trend === 1)) {
        ht.push({ time: t, value: htPt.v, color: htPt.trend === 0 ? HT_UP_COLOR : HT_DOWN_COLOR });
      } else {
        // Whitespace point: keeps the time axis dense so the line resumes
        // cleanly instead of interpolating across a gap in the data.
        ht.push({ time: t });
      }
    }
    try { ema9Series.setData(e9); } catch (e) {}
    try { ema21Series.setData(e21); } catch (e) {}
    try { ema55Series.setData(e55); } catch (e) {}
    try { ema200Series.setData(e200); } catch (e) {}
    try { htSeries.setData(ht); } catch (e) {}
  }

  // Records the EMA baseline (last CLOSED bar) and the forming-bar time,
  // both consumed by the live "candle" WS handler between history
  // refreshes. Safe to call with a body that has no/short indicator
  // arrays -- baseline just stays null and advanceEma() no-ops.
  function setEmaBaseline(body) {
    var rows = Array.isArray(body.candles) ? body.candles : [];
    var n = rows.length;
    lastBarT = n ? rows[n - 1].t : null;
    var closedIdx = n - 2; // n-1 is the still-forming bar
    function baseline(arr) {
      var v = arrAt(arr, closedIdx);
      return isNumeric(v) ? v : null;
    }
    emaPrev.e9 = baseline(body.ema9);
    emaPrev.e21 = baseline(body.ema21);
    emaPrev.e55 = baseline(body.ema55);
    emaPrev.e200 = baseline(body.ema200);
  }

  function advanceEma(seriesRef, key, time, close) {
    var prev = emaPrev[key];
    if (!isNumeric(prev) || !isNumeric(close) || !isNumeric(time)) return;
    var next = prev + emaK[key] * (close - prev);
    try { seriesRef.update({ time: time, value: next }); } catch (e) {}
  }

  function resizeChart() {
    if (!chart || !chartWrap) return;
    chart.resize(chartWrap.clientWidth, chartWrap.clientHeight);
  }

  // ---- Candle mapping ----------------------------------------------------
  function toLwCandle(c) {
    return { time: c.t, open: c.o, high: c.h, low: c.l, close: c.c };
  }

  function isNumeric(x) {
    return typeof x === "number" && isFinite(x);
  }

  function isValidCandle(c) {
    return c && isNumeric(c.t) && isNumeric(c.o) && isNumeric(c.h)
      && isNumeric(c.l) && isNumeric(c.c);
  }

  // ---- Past-trade markers (entries/exits + entry->exit dotted lines) -----
  // TF name -> seconds, used to snap a trade's raw `ts` to the containing
  // bar of whatever TF is currently loaded.
  var TF_SECONDS = { M1: 60, M5: 300, M15: 900, M30: 1800, H1: 3600, H4: 14400, D1: 86400 };
  var BASKETS_LINE_MAX = 30;
  var basketLineSeries = [];   // dotted entry->exit LineSeries, cleared+rebuilt every refresh

  // Snap `ts` to the containing bar time for the current TF, but only
  // return a time that is actually a loaded candle -- markers/lines must
  // reference real candle times or Lightweight Charts misbehaves. Falls
  // back to the nearest loaded candle time <= ts; returns null if none.
  function snapToLoadedBar(ts, tfSeconds, sortedCandleTimes) {
    if (!isNumeric(ts) || !isNumeric(tfSeconds) || tfSeconds <= 0) return null;
    if (!Array.isArray(sortedCandleTimes) || !sortedCandleTimes.length) return null;
    var floored = Math.floor(ts / tfSeconds) * tfSeconds;
    // Binary search for floored in sortedCandleTimes; if present, use it.
    var lo = 0, hi = sortedCandleTimes.length - 1, exact = -1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (sortedCandleTimes[mid] === floored) { exact = mid; break; }
      if (sortedCandleTimes[mid] < floored) lo = mid + 1; else hi = mid - 1;
    }
    if (exact !== -1) return sortedCandleTimes[exact];
    // Nearest loaded candle time <= ts (not <= floored -- ts itself is the
    // real anchor; floored may sit before the first loaded candle).
    lo = 0; hi = sortedCandleTimes.length - 1;
    var best = -1;
    while (lo <= hi) {
      var m = (lo + hi) >> 1;
      if (sortedCandleTimes[m] <= ts) { best = m; lo = m + 1; } else hi = m - 1;
    }
    return best === -1 ? null : sortedCandleTimes[best];
  }

  function clearBasketLines() {
    basketLineSeries.forEach(function (s) {
      try { chart.removeSeries(s); } catch (e) {}
    });
    basketLineSeries = [];
  }

  function lotWeightedAvg(entries) {
    var totLots = 0, totVal = 0;
    entries.forEach(function (e) {
      var lots = isNumeric(e.lots) ? e.lots : 0;
      var price = isNumeric(e.price) ? e.price : null;
      if (price === null) return;
      totLots += lots;
      totVal += lots * price;
    });
    if (totLots > 0) return totVal / totLots;
    // No usable lots -- fall back to a plain average of valid prices.
    var prices = entries.map(function (e) { return e.price; }).filter(isNumeric);
    if (!prices.length) return null;
    return prices.reduce(function (a, b) { return a + b; }, 0) / prices.length;
  }

  function renderTradeMarkers(body, tf, sortedCandleTimes) {
    clearBasketLines();
    if (!series) return;
    var tfSeconds = TF_SECONDS[tf];
    var baskets = (body && Array.isArray(body.baskets)) ? body.baskets : [];
    var markers = [];
    var lineCount = 0;
    baskets.forEach(function (basket) {
      if (!basket || !Array.isArray(basket.entries)) return;
      var direction = basket.direction;
      var isBuy = direction === "BUY" || direction === "buy";
      var isSell = direction === "SELL" || direction === "sell";
      if (!isBuy && !isSell) return;
      var validEntries = [];
      basket.entries.forEach(function (e) {
        if (!e || !isNumeric(e.ts) || !isNumeric(e.price)) return;
        var t = snapToLoadedBar(e.ts, tfSeconds, sortedCandleTimes);
        if (t === null) return;
        var lots = isNumeric(e.lots) ? e.lots : 0;
        markers.push({
          time: t,
          position: isBuy ? "belowBar" : "aboveBar",
          color: isBuy ? "#26a69a" : "#ef5350",
          shape: isBuy ? "arrowUp" : "arrowDown",
          text: (isBuy ? "B " : "S ") + lots.toFixed(2)
        });
        validEntries.push({ t: t, ts: e.ts, price: e.price, lots: lots });
      });
      var exit = basket.exit;
      var exitT = null;
      if (exit && isNumeric(exit.ts) && isNumeric(exit.price)) {
        exitT = snapToLoadedBar(exit.ts, tfSeconds, sortedCandleTimes);
        if (exitT !== null) {
          markers.push({
            time: exitT,
            position: isBuy ? "aboveBar" : "belowBar",
            color: "#9aa5b8",
            shape: "circle",
            text: "X"
          });
        }
      }
      // Dotted entry->exit line for a CLOSED basket only, capped at 30.
      if (exitT !== null && validEntries.length && lineCount < BASKETS_LINE_MAX) {
        var entryPrice = lotWeightedAvg(validEntries);
        var entryTimes = validEntries.map(function (e) { return e.t; });
        var entryTime = Math.min.apply(null, entryTimes);
        if (entryPrice !== null && entryTime !== exitT) {
          var profit = isNumeric(exit.profit) ? exit.profit : 0;
          try {
            var lineSeries = chart.addLineSeries({
              lineStyle: LightweightCharts.LineStyle.Dotted,
              lineWidth: 1,
              color: profit >= 0 ? "#26a69a" : "#ef5350",
              priceLineVisible: false,
              lastValueVisible: false
            });
            lineSeries.setData([
              { time: entryTime, value: entryPrice },
              { time: exitT, value: exit.price }
            ]);
            basketLineSeries.push(lineSeries);
            lineCount++;
          } catch (e) {}
        }
      }
    });
    markers.sort(function (a, b) { return a.time - b.time; });
    try { series.setMarkers(markers); } catch (e) {}
  }

  function fetchAndDrawTrades(tf, sortedCandleTimes) {
    var t = tg();
    fetch("/api/trades?limit=50", {
        headers: { "X-Telegram-Init-Data": t ? (t.initData || "") : "" }
      })
      .then(function (r) {
        if (!r.ok) throw new Error("trades http " + r.status);
        return r.json();
      })
      .then(function (body) {
        if (tf !== currentTf) return;   // stale response, TF moved on
        renderTradeMarkers(body, tf, sortedCandleTimes);
      })
      .catch(function () {
        // Fail open: no markers this refresh, chart itself is unaffected.
      });
  }

  // ---- TF state + buttons -------------------------------------------------
  var currentTf = "M5";

  function renderTfButtons(tfs) {
    tfRow.innerHTML = "";
    tfs.forEach(function (tf) {
      var btn = document.createElement("button");
      btn.className = "tf-btn" + (tf === currentTf ? " active" : "");
      btn.textContent = tf;
      btn.dataset.tf = tf;
      btn.addEventListener("click", function () { selectTf(tf); });
      tfRow.appendChild(btn);
    });
  }

  function highlightActiveTf() {
    var btns = tfRow.querySelectorAll(".tf-btn");
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle("active", btns[i].dataset.tf === currentTf);
    }
  }

  function loadHistory(tf) {
    // REST reads initData from a header, not the URL, so it never lands in
    // a reverse proxy's/tunnel's access log (WS has no such choice — see
    // wsUrl() below, browsers can't set custom headers on a WS handshake).
    var t = tg();
    return fetch("/api/history?tf=" + encodeURIComponent(tf), {
        headers: { "X-Telegram-Init-Data": t ? (t.initData || "") : "" }
      })
      .then(function (r) {
        if (!r.ok) throw new Error("history http " + r.status);
        return r.json();
      })
      .then(function (body) {
        // A TF switch (or a WS snapshot that changed TF) may have moved
        // currentTf on while this request was in flight — a stale
        // response must not clobber the newer selection.
        if (tf !== currentTf) return;
        if (!body || !Array.isArray(body.candles)) return;
        var rows = [], times = [], idxMap = [];
        for (var i = 0; i < body.candles.length; i++) {
          if (!isValidCandle(body.candles[i])) continue;
          var lw = toLwCandle(body.candles[i]);
          rows.push(lw);
          times.push(lw.time);
          idxMap.push(i);
        }
        series.setData(rows);
        setIndicatorSeriesData(body, idxMap, times);
        setEmaBaseline(body);
        // Past-trade markers: refetched after every successful history
        // load (initial boot, TF switch, and the bar-rollover refetch in
        // handleMessage's "candle" branch all funnel through here), using
        // this response's own candle times to snap trade timestamps onto
        // loaded bars for whichever TF is now on screen.
        fetchAndDrawTrades(tf, times);
      })
      .catch(function () {
        // Fail open: keep whatever is currently on the chart, the WS
        // stream (or the next TF click / reconnect) will catch it up.
      });
  }

  function selectTf(tf) {
    if (tf === currentTf) return;
    currentTf = tf;
    highlightActiveTf();
    loadHistory(tf);
  }

  // ---- Header (tick) --------------------------------------------------------
  function applyTick(tick) {
    if (!tick || !isNumeric(tick.bid) || !isNumeric(tick.ask)) return;
    bidEl.textContent = tick.bid.toFixed(2);
    askEl.textContent = tick.ask.toFixed(2);
    // Spread in points: XAUUSD quotes 2 decimals -> 1 point = 0.01.
    var spreadPoints = (tick.ask - tick.bid) * 100;
    spreadEl.textContent = spreadPoints.toFixed(1);
  }

  // ---- Positions: price lines + card --------------------------------------
  var activeLines = [];

  function clearLines() {
    activeLines.forEach(function (line) {
      try { series.removePriceLine(line); } catch (e) {}
    });
    activeLines = [];
  }

  function isValidPosition(p) {
    return p && isNumeric(p.entry) && isNumeric(p.lots);
  }

  function addLine(price, opts) {
    activeLines.push(series.createPriceLine(Object.assign({ price: price }, opts)));
  }

  function renderPositions(positions) {
    clearLines();
    var valid = Array.isArray(positions) ? positions.filter(isValidPosition) : [];

    valid.forEach(function (p) {
      addLine(p.entry, {
        color: "#9aa5b8",
        lineWidth: 1,
        lineStyle: LightweightCharts.LineStyle.Dashed,
        axisLabelVisible: true,
        title: "E " + p.lots.toFixed(2)
      });
      if (isNumeric(p.sl) && p.sl > 0) {
        addLine(p.sl, {
          color: "#ef5350",
          lineWidth: 1,
          lineStyle: LightweightCharts.LineStyle.Solid,
          axisLabelVisible: true,
          title: "SL"
        });
      }
      if (isNumeric(p.tp) && p.tp > 0) {
        addLine(p.tp, {
          color: "#26a69a",
          lineWidth: 1,
          lineStyle: LightweightCharts.LineStyle.Solid,
          axisLabelVisible: true,
          title: "TP"
        });
      }
    });

    if (valid.length === 0) {
      posCard.classList.remove("visible");
      posCard.innerHTML = "";
      return;
    }

    var totalLots = 0;
    var weightedEntry = 0;
    var totalProfit = 0;
    valid.forEach(function (p) {
      totalLots += p.lots;
      weightedEntry += p.entry * p.lots;
      totalProfit += isNumeric(p.profit) ? p.profit : 0;
    });
    var avgEntry = totalLots > 0 ? weightedEntry / totalLots : valid[0].entry;

    // Whitelist the direction text before it ever reaches innerHTML — a
    // raw feed string must never land in the DOM as markup, however
    // implausible an attacker-controlled feed value is in practice.
    var rawDir = (valid[0].direction || "").toString().toUpperCase();
    var dir = rawDir === "SELL" ? "SELL" : rawDir === "BUY" ? "BUY" : "—";
    var dirClass = rawDir === "SELL" ? "dir-sell" : "dir-buy";
    var profitClass = totalProfit >= 0 ? "profit-pos" : "profit-neg";

    posCard.innerHTML =
      '<div class="row"><span class="' + dirClass + '">' + dir + '</span>' +
      '<span>' + totalLots.toFixed(2) + ' lots</span></div>' +
      '<div class="row"><span>Entry</span><span>' + avgEntry.toFixed(2) + '</span></div>' +
      '<div class="row"><span>P/L</span><span class="' + profitClass + '">' +
      (totalProfit >= 0 ? "+" : "") + totalProfit.toFixed(2) + '</span></div>';
    posCard.classList.add("visible");
  }

  // ---- Connection state: dot + offline banner ------------------------------
  var lastMsgAt = Date.now();
  var offline = true;

  function setOnline(isOnline) {
    offline = !isOnline;
    dot.classList.toggle("online", isOnline);
    offlineBanner.classList.toggle("visible", !isOnline);
  }
  // Deliberately no setOnline(false) call at top level: the banner/dot
  // markup already default to the offline look (see CSS), and at t=0
  // neither trigger condition (no message for 10s / socket closed) is
  // true yet. This avoids a flash of "Connection lost" on every fresh
  // page load while the first WS handshake is still in flight.

  // ---- WebSocket with reset-on-snapshot + reconnect backoff -----------------
  var ws = null;
  var reconnectAttempt = 0;
  var reconnectTimer = null;

  function wsUrl() {
    var proto = window.location.protocol === "https:" ? "wss:" : "ws:";
    return withInitData(proto + "//" + window.location.host + "/ws");
  }

  function scheduleReconnect() {
    if (reconnectTimer) return;
    var delay = RECONNECT_STEPS_MS[Math.min(reconnectAttempt, RECONNECT_STEPS_MS.length - 1)];
    reconnectAttempt++;
    reconnectTimer = setTimeout(function () {
      reconnectTimer = null;
      connect();
    }, delay);
  }

  function handleMessage(msg) {
    if (!msg || typeof msg !== "object") return;

    switch (msg.type) {
      case "snapshot":
        // BINDING: a snapshot is a full RESET — deltas can arrive before
        // it (racing an in-flight reconnect), so it must clobber state
        // rather than merge with whatever came before. It is NOT a
        // feed-liveness signal, though: the server sends a snapshot on
        // every WS connect regardless of whether the bridge is still
        // pushing, purely reflecting whatever is left in FeedState. If
        // a snapshot bumped lastMsgAt/setOnline(true), a dead bridge
        // with the service still up would show ~10s of green-dot STALE
        // prices per 1s of banner on every reconnect cycle — so it
        // applies its data (chart/positions) without touching liveness
        // state at all.
        var tfs = Array.isArray(msg.tfs) && msg.tfs.length ? msg.tfs : DEFAULT_TFS;
        if (tfs.indexOf(currentTf) === -1) currentTf = tfs[0];
        renderTfButtons(tfs);
        loadHistory(currentTf);
        applyTick(msg.tick);
        renderPositions(msg.positions);
        break;

      case "tick":
        // Feed-liveness signal: the bridge pushes ticks ~every 0.5s, so
        // seeing one means real upstream data is flowing right now.
        lastMsgAt = Date.now();
        setOnline(true);
        applyTick(msg.tick);
        break;

      case "candle":
        // Feed-liveness signal too (bridge pushes bars ~every 2s),
        // regardless of which TF the candle is for — bump it before the
        // TF-match gate below so an off-screen TF's candle still counts.
        lastMsgAt = Date.now();
        setOnline(true);
        // Only apply candle updates for the TF currently on screen.
        if (msg.tf !== currentTf) break;
        if (isValidCandle(msg.candle)) {
          try {
            series.update(toLwCandle(msg.candle));
          } catch (e) {
            // Lightweight Charts throws if the update's time is older
            // than the series' current tail (e.g. a stale delta landing
            // just after a fresh setData from a TF switch/snapshot) —
            // drop it; the next in-order update supersedes it anyway.
            // handleMessage runs outside ws.onmessage's JSON.parse
            // try/catch, so an uncaught throw here would otherwise kill
            // this message dispatch (and, depending on the browser,
            // possibly the socket's event handling).
          }
          // Indicator live update. HalfTrend only recomputes correctly
          // from the full closed-bar history (its state machine walks
          // bar-by-bar), so it is NOT advanced client-side: a bar
          // ROLLOVER (a genuinely new t, not just the forming bar being
          // re-pushed) instead triggers a full /api/history refetch,
          // which redraws every overlay -- including HalfTrend -- from
          // server truth. Same-bar updates (t === lastBarT) advance only
          // the EMA lines with the exact recurrence, using the baseline
          // captured from the last server-provided closed bar.
          if (lastBarT === null || msg.candle.t > lastBarT) {
            loadHistory(currentTf);
          } else if (msg.candle.t === lastBarT) {
            advanceEma(ema9Series, "e9", msg.candle.t, msg.candle.c);
            advanceEma(ema21Series, "e21", msg.candle.t, msg.candle.c);
            advanceEma(ema55Series, "e55", msg.candle.t, msg.candle.c);
            advanceEma(ema200Series, "e200", msg.candle.t, msg.candle.c);
          }
          // msg.candle.t < lastBarT: stale/out-of-order delta -- ignored
          // for indicator purposes too (the candle series update above
          // already dropped it via its own catch).
        }
        break;

      case "positions":
        renderPositions(msg.positions);
        break;

      default:
        break; // unknown message type: ignore, don't throw
    }
  }

  function connect() {
    try {
      ws = new WebSocket(wsUrl());
    } catch (e) {
      scheduleReconnect();
      return;
    }

    ws.onopen = function () {
      reconnectAttempt = 0;
      lastMsgAt = Date.now();
    };

    ws.onmessage = function (evt) {
      var msg;
      try {
        msg = JSON.parse(evt.data);
      } catch (e) {
        return; // malformed frame: ignore, don't crash the socket handler
      }
      handleMessage(msg);
    };

    ws.onclose = function () {
      setOnline(false);
      scheduleReconnect();
    };

    ws.onerror = function () {
      try { ws.close(); } catch (e) {}
    };
  }

  // ---- Tabs + Trades report ------------------------------------------------
  // Chart | Trades. The Trades tab is a read-only report over the trades
  // log (GET /api/report, viewer-auth'd exactly like /api/history via the
  // X-Telegram-Init-Data header). Flow: Month (default, current broker
  // month) -> tap a day -> Day view -> "Back". CSV export is client-side
  // from the loaded rows (Blob download + a clipboard "Copy CSV" fallback,
  // because Telegram's webview may swallow <a download>). No trading
  // controls exist here by construction.
  var repState = { view: "month", month: null, date: null, data: null, loading: false };
  var repEls = {};

  function initHeaders() {
    var t = tg();
    return { "X-Telegram-Init-Data": t ? (t.initData || "") : "" };
  }

  function pad2(n) { return (n < 10 ? "0" : "") + n; }

  function currentMonthKey() {
    // Client clock is a fine default; the server clamps to broker days
    // and ‹ › moves from whatever it returns.
    var d = new Date();
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1);
  }

  function shiftMonth(key, delta) {
    var parts = (key || currentMonthKey()).split("-");
    var y = parseInt(parts[0], 10), m = parseInt(parts[1], 10);
    if (!isFinite(y) || !isFinite(m)) return currentMonthKey();
    m += delta;
    while (m < 1) { m += 12; y -= 1; }
    while (m > 12) { m -= 12; y += 1; }
    return y + "-" + pad2(m);
  }

  function monthTitle(key) {
    var names = ["January", "February", "March", "April", "May", "June", "July",
                 "August", "September", "October", "November", "December"];
    var parts = (key || "").split("-");
    var y = parseInt(parts[0], 10), m = parseInt(parts[1], 10);
    if (!isFinite(y) || !isFinite(m) || m < 1 || m > 12) return key || "—";
    return names[m - 1] + " " + y;
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = String(text);
    return e;
  }

  function fmtMoney(v) {
    if (!isNumeric(v)) return "–";
    return (v > 0 ? "+" : "") + v.toFixed(2);
  }
  function fmtBal(v) { return isNumeric(v) ? v.toFixed(2) : "–"; }
  function fmtPx(v) { return isNumeric(v) ? v.toFixed(2) : "–"; }
  function plClass(v) { return !isNumeric(v) || v === 0 ? "" : (v > 0 ? "pos" : "neg"); }

  function regimeMix(regimes) {
    if (!regimes || typeof regimes !== "object") return "–";
    var order = ["trend", "range", "high_volatility", "unknown"];
    var short = { trend: "trend", range: "range", high_volatility: "highvol", unknown: "?" };
    var out = [];
    order.forEach(function (k) {
      if (isNumeric(regimes[k]) && regimes[k] > 0) out.push(short[k] + " " + regimes[k]);
    });
    Object.keys(regimes).forEach(function (k) {
      if (order.indexOf(k) === -1 && isNumeric(regimes[k]) && regimes[k] > 0) out.push(k + " " + regimes[k]);
    });
    return out.length ? out.join(" · ") : "–";
  }

  function aiMark(ai) {
    if (ai === "agree") return "✅";
    if (ai === "disagree") return "⚠️";
    return "–";
  }

  function setRepStatus(text) {
    repEls.status.textContent = text;
    repEls.status.style.display = text ? "block" : "none";
  }

  function showToast(text) {
    repEls.toast.textContent = text;
    repEls.toast.classList.add("visible");
    clearTimeout(repEls.toastTimer);
    repEls.toastTimer = setTimeout(function () { repEls.toast.classList.remove("visible"); }, 1800);
  }

  function renderSpark(values) {
    var svg = repEls.spark;
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    var vals = (Array.isArray(values) ? values : []).filter(isNumeric);
    if (vals.length < 2) return;
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    var span = (max - min) || 1;
    var W = 120, H = 34, pad = 2;
    var pts = vals.map(function (v, i) {
      var x = pad + (W - 2 * pad) * i / (vals.length - 1);
      var y = H - pad - (H - 2 * pad) * (v - min) / span;
      return x.toFixed(1) + "," + y.toFixed(1);
    });
    var pl = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
    pl.setAttribute("points", pts.join(" "));
    svg.appendChild(pl);
  }

  function renderMonth(data) {
    var thead = repEls.table.tHead, tbody = repEls.table.tBodies[0];
    thead.innerHTML = ""; tbody.innerHTML = "";
    var hr = el("tr");
    ["Day", "Trades", "W/L", "P/L $", "Balance", "Regime mix"].forEach(function (h) { hr.appendChild(el("th", null, h)); });
    thead.appendChild(hr);
    var days = Array.isArray(data.days) ? data.days : [];
    days.forEach(function (d) {
      if (!d || typeof d !== "object") return;
      var tr = el("tr", "day-row");
      tr.appendChild(el("td", null, d.label || d.date || "–"));
      tr.appendChild(el("td", null, isNumeric(d.trades) ? d.trades : "–"));
      tr.appendChild(el("td", null, (isNumeric(d.wins) ? d.wins : 0) + "/" + (isNumeric(d.losses) ? d.losses : 0)));
      tr.appendChild(el("td", plClass(d.pl), fmtMoney(d.pl)));
      tr.appendChild(el("td", null, fmtBal(d.balance_end)));
      tr.appendChild(el("td", "muted", regimeMix(d.regimes)));
      if (d.date) tr.addEventListener("click", function () { openDay(d.date); });
      tbody.appendChild(tr);
    });
    var f = data.footer || {};
    var foot = repEls.foot;
    foot.innerHTML = "";
    function line(k, v, cls) {
      var row = el("div");
      row.appendChild(el("span", "k", k));
      row.appendChild(el("span", cls || null, v));
      foot.appendChild(row);
    }
    line("Month net", fmtMoney(f.pl), plClass(f.pl));
    line("Trades", (isNumeric(f.trades) ? f.trades : 0) + "  ·  win " + (isNumeric(f.win_pct) ? f.win_pct.toFixed(1) + "%" : "–"));
    line("Best day", f.best_day ? (f.best_day.label + " " + fmtMoney(f.best_day.pl)) : "–", f.best_day ? plClass(f.best_day.pl) : "");
    line("Worst day", f.worst_day ? (f.worst_day.label + " " + fmtMoney(f.worst_day.pl)) : "–", f.worst_day ? plClass(f.worst_day.pl) : "");
    var rw = data.regime_winrates || {};
    var parts = [];
    ["trend", "range", "high_volatility"].forEach(function (k) {
      var r = rw[k];
      if (r && isNumeric(r.trades) && r.trades > 0) {
        parts.push(k.replace("high_volatility", "highvol") + " " + (isNumeric(r.win_pct) ? r.win_pct.toFixed(0) : "–") + "% (" + r.wins + "/" + r.trades + ")");
      }
    });
    line("Regime win-rate", parts.length ? parts.join("  ·  ") : "–");
    renderSpark(data.equity);
    setRepStatus(days.length ? "" : "No closed trades this month.");
    repEls.table.style.display = days.length ? "table" : "none";
    repEls.foot.style.display = "block";
  }

  function renderDay(data) {
    var thead = repEls.table.tHead, tbody = repEls.table.tBodies[0];
    thead.innerHTML = ""; tbody.innerHTML = "";
    var hr = el("tr");
    ["Time", "Dir", "Mode", "Entry → Exit", "Reason", "P/L $", "Balance", "AI"].forEach(function (h) { hr.appendChild(el("th", null, h)); });
    thead.appendChild(hr);
    var rows = Array.isArray(data.rows) ? data.rows : [];
    rows.forEach(function (r) {
      if (!r || typeof r !== "object") return;
      var tr = el("tr");
      tr.appendChild(el("td", null, r.time || "–"));
      var dir = (r.direction || "").toString().toUpperCase();
      tr.appendChild(el("td", dir === "BUY" ? "dir-buy" : (dir === "SELL" ? "dir-sell" : ""), dir === "BUY" || dir === "SELL" ? dir : "–"));
      tr.appendChild(el("td", "muted", (r.mode || "adr").toString().toUpperCase()));
      var ent = fmtPx(r.entry) + (isNumeric(r.entries) && r.entries > 1 ? " (" + r.entries + ")" : "");
      tr.appendChild(el("td", null, ent + " → " + fmtPx(r.exit)));
      tr.appendChild(el("td", "l muted", r.reason || "–"));
      tr.appendChild(el("td", plClass(r.pl), fmtMoney(r.pl)));
      tr.appendChild(el("td", null, fmtBal(r.balance_after)));
      var aiCell = el("td", null, aiMark(r.ai));
      if (r.ai_direction) aiCell.title = "AI " + r.ai_direction + (isNumeric(r.ai_confidence) ? " " + (r.ai_confidence * 100).toFixed(0) + "%" : "");
      tr.appendChild(aiCell);
      tbody.appendChild(tr);
    });
    var f = data.footer || {};
    var foot = repEls.foot;
    foot.innerHTML = "";
    var l1 = el("div"); l1.appendChild(el("span", "k", "Day net")); l1.appendChild(el("span", plClass(f.pl), fmtMoney(f.pl))); foot.appendChild(l1);
    var l2 = el("div"); l2.appendChild(el("span", "k", "Trades")); l2.appendChild(el("span", null, (isNumeric(f.trades) ? f.trades : 0) + "  ·  wins " + (isNumeric(f.wins) ? f.wins : 0))); foot.appendChild(l2);
    renderSpark([]);
    setRepStatus(rows.length ? "" : "No closed trades this day.");
    repEls.table.style.display = rows.length ? "table" : "none";
    repEls.foot.style.display = "block";
  }

  function renderReport() {
    var d = repState.data;
    repEls.back.style.display = repState.view === "day" ? "" : "none";
    repEls.prev.style.display = repState.view === "month" ? "" : "none";
    repEls.next.style.display = repState.view === "month" ? "" : "none";
    if (repState.view === "month") {
      repEls.title.textContent = monthTitle(repState.month);
    } else {
      repEls.title.textContent = (d && d.label) ? d.label : (repState.date || "—");
    }
    if (!d) { repEls.table.style.display = "none"; repEls.foot.style.display = "none"; return; }
    if (repState.view === "month") renderMonth(d); else renderDay(d);
  }

  function loadReport() {
    var url = repState.view === "month"
      ? "/api/report?view=month&month=" + encodeURIComponent(repState.month)
      : "/api/report?view=day&date=" + encodeURIComponent(repState.date);
    var token = {};
    repState.token = token;
    repState.data = null;
    setRepStatus("Loading…");
    repEls.table.style.display = "none";
    repEls.foot.style.display = "none";
    renderReport();
    fetch(url, { headers: initHeaders() })
      .then(function (r) {
        if (!r.ok) throw new Error("report http " + r.status);
        return r.json();
      })
      .then(function (body) {
        if (repState.token !== token) return;   // stale: view moved on
        repState.data = (body && typeof body === "object") ? body : {};
        renderReport();
      })
      .catch(function () {
        if (repState.token !== token) return;
        setRepStatus("Report unavailable — try again.");
      });
  }

  function openMonth(key) {
    repState.view = "month";
    repState.month = key || repState.month || currentMonthKey();
    loadReport();
  }

  function openDay(date) {
    repState.view = "day";
    repState.date = date;
    loadReport();
  }

  // ---- CSV (client-side, from the loaded rows) ----
  function csvCell(v) {
    if (v === null || v === undefined) return "";
    var s = String(v);
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function buildCsv() {
    var d = repState.data;
    if (!d) return "";
    var lines = [];
    if (repState.view === "month") {
      lines.push(["date", "trades", "wins", "losses", "pl", "balance_end", "regimes"].join(","));
      (Array.isArray(d.days) ? d.days : []).forEach(function (r) {
        if (!r) return;
        lines.push([r.date, r.trades, r.wins, r.losses, r.pl, r.balance_end, regimeMix(r.regimes)].map(csvCell).join(","));
      });
    } else {
      lines.push(["date", "time", "direction", "mode", "entries", "lots", "entry", "exit", "reason", "pl", "balance_after", "regime", "ai", "ai_direction", "ai_confidence"].join(","));
      (Array.isArray(d.rows) ? d.rows : []).forEach(function (r) {
        if (!r) return;
        lines.push([r.day || d.date, r.time, r.direction, r.mode, r.entries, r.lots, r.entry, r.exit, r.reason, r.pl, r.balance_after, r.regime, r.ai, r.ai_direction, r.ai_confidence].map(csvCell).join(","));
      });
    }
    return lines.join("\r\n") + "\r\n";
  }

  function csvName() {
    return "xau-trades-" + (repState.view === "month" ? repState.month : repState.date) + ".csv";
  }

  function downloadCsv() {
    var csv = buildCsv();
    if (!csv) { showToast("Nothing to export"); return; }
    try {
      var blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = csvName();
      a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 1000);
      showToast("CSV download started (use Copy CSV if nothing appears)");
    } catch (e) {
      copyCsv();
    }
  }

  function copyCsv() {
    var csv = buildCsv();
    if (!csv) { showToast("Nothing to copy"); return; }
    function legacy() {
      try {
        var ta = document.createElement("textarea");
        ta.value = csv;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand("copy");
        document.body.removeChild(ta);
        showToast(ok ? "CSV copied" : "Copy failed");
      } catch (e) {
        showToast("Copy failed");
      }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(csv).then(function () { showToast("CSV copied"); }, legacy);
    } else {
      legacy();
    }
  }

  // ---- Tab switching ----
  var currentTab = "chart";
  function selectTab(tab) {
    if (tab !== "chart" && tab !== "trades") return;
    currentTab = tab;
    document.getElementById("chartPanel").classList.toggle("active", tab === "chart");
    document.getElementById("tradesPanel").classList.toggle("active", tab === "trades");
    document.getElementById("tabChart").classList.toggle("active", tab === "chart");
    document.getElementById("tabTrades").classList.toggle("active", tab === "trades");
    if (tab === "chart") {
      // the chart was display:none while hidden -- force a re-measure
      setTimeout(resizeChart, 0);
    } else {
      // (re)load on every open so the report reflects the latest closes
      if (repState.view === "day" && repState.date) openDay(repState.date);
      else openMonth(repState.month || currentMonthKey());
    }
  }

  function bootTrades() {
    repEls.back = document.getElementById("repBack");
    repEls.prev = document.getElementById("repPrev");
    repEls.next = document.getElementById("repNext");
    repEls.title = document.getElementById("repTitle");
    repEls.csv = document.getElementById("repCsv");
    repEls.copy = document.getElementById("repCopy");
    repEls.spark = document.getElementById("repSpark");
    repEls.status = document.getElementById("repStatus");
    repEls.table = document.getElementById("repTable");
    repEls.foot = document.getElementById("repFoot");
    repEls.toast = document.getElementById("toast");
    repState.month = currentMonthKey();

    document.getElementById("tabChart").addEventListener("click", function () { selectTab("chart"); });
    document.getElementById("tabTrades").addEventListener("click", function () { selectTab("trades"); });
    repEls.back.addEventListener("click", function () { openMonth(repState.month); });
    repEls.prev.addEventListener("click", function () { openMonth(shiftMonth(repState.month, -1)); });
    repEls.next.addEventListener("click", function () { openMonth(shiftMonth(repState.month, +1)); });
    repEls.csv.addEventListener("click", downloadCsv);
    repEls.copy.addEventListener("click", copyCsv);
    renderReport();
  }

  // ---- Boot -----------------------------------------------------------------
  // Runs once the document (including deferred scripts, guaranteed by
  // spec to run before DOMContentLoaded) has parsed, so tg() reliably
  // reflects a real Telegram WebView here — this is where ready()/
  // expand() and the Telegram-themed chart colors actually take effect.
  function boot() {
    chartWrap = document.getElementById("chartWrap");
    chartEl = document.getElementById("chart");
    tfRow = document.getElementById("tfRow");
    bidEl = document.getElementById("bidVal");
    askEl = document.getElementById("askVal");
    spreadEl = document.getElementById("spreadVal");
    posCard = document.getElementById("posCard");
    dot = document.getElementById("dot");
    offlineBanner = document.getElementById("offlineBanner");

    var t = tg();
    if (t) {
      try { t.ready(); } catch (e) {}
      try { t.expand(); } catch (e) {}
    }

    var colors = themeColors();
    chart = LightweightCharts.createChart(chartEl, {
      layout: {
        background: { type: "solid", color: colors.bg },
        textColor: colors.text
      },
      grid: {
        vertLines: { color: colors.grid },
        horzLines: { color: colors.grid }
      },
      rightPriceScale: {
        borderColor: colors.border
      },
      timeScale: {
        borderColor: colors.border,
        timeVisible: true,
        secondsVisible: true
      },
      crosshair: {
        mode: LightweightCharts.CrosshairMode.Normal
      },
      autoSize: true
    });

    // Overlays are added BEFORE the candlestick series so candles paint on
    // top of them (Lightweight Charts draws later-added series on top),
    // matching render.py's PNG zorder (indicators under the OHLC bars).
    var noLabel = { priceLineVisible: false, lastValueVisible: false };
    ema9Series = chart.addLineSeries(Object.assign(
      { color: "#888888", lineWidth: 1 }, noLabel));
    ema21Series = chart.addLineSeries(Object.assign(
      { color: "#888888", lineWidth: 1 }, noLabel));
    ema55Series = chart.addLineSeries(Object.assign(
      { color: "#f5c542", lineWidth: 2 }, noLabel));       // gold
    ema200Series = chart.addLineSeries(Object.assign(
      { color: "mediumpurple", lineWidth: 2 }, noLabel));
    // Base `color` is just the series-level fallback (e.g. for an empty
    // series) -- actual rendering uses the per-point `color` set on each
    // data item in setIndicatorSeriesData(), so the line itself flips
    // blue/red at trend changes.
    htSeries = chart.addLineSeries(Object.assign(
      { color: HT_UP_COLOR, lineWidth: 2 }, noLabel));

    series = chart.addCandlestickSeries({
      upColor: "#26a69a",
      downColor: "#ef5350",
      borderUpColor: "#26a69a",
      borderDownColor: "#ef5350",
      wickUpColor: "#26a69a",
      wickDownColor: "#ef5350"
    });

    // Belt-and-suspenders resize: autoSize handles most cases, but
    // Telegram WebApp viewport changes (keyboard, safe-area) don't
    // always fire a window resize event.
    window.addEventListener("resize", resizeChart);
    if (t && t.onEvent) {
      try { t.onEvent("viewportChanged", resizeChart); } catch (e) {}
    }

    setInterval(function () {
      if (Date.now() - lastMsgAt > OFFLINE_TIMEOUT_MS) {
        setOnline(false);
        // A half-open socket (network dropped without a clean close
        // frame ever arriving) never fires onclose on its own — force
        // it shut so scheduleReconnect actually engages instead of
        // waiting indefinitely on a connection that looks alive but
        // isn't.
        if (ws) {
          try { ws.close(); } catch (e) {}
        }
      }
    }, 1000);

    renderTfButtons(DEFAULT_TFS);
    loadHistory(currentTf);
    connect();
    bootTrades();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>

</html>
