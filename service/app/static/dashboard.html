<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iziGold — XAU Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="/static/vendor/lightweight-charts.standalone.production.js"></script>
<style>
:root {
  --bg-dark: #090d14;
  --bg-card: rgba(18, 24, 38, 0.75);
  --bg-card-hover: rgba(26, 35, 54, 0.85);
  --border-card: rgba(255, 255, 255, 0.08);
  --gold-primary: #f5c542;
  --gold-glow: rgba(245, 197, 66, 0.15);
  --text-main: #f1f5f9;
  --text-muted: #94a3b8;
  --pos-green: #10b981;
  --pos-bg: rgba(16, 185, 129, 0.12);
  --neg-red: #ef4444;
  --neg-bg: rgba(239, 68, 68, 0.12);
  --accent-blue: #3b82f6;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  background-color: var(--bg-dark);
  background-image: 
    radial-gradient(circle at 15% 15%, rgba(245, 197, 66, 0.04) 0%, transparent 40%),
    radial-gradient(circle at 85% 85%, rgba(59, 130, 246, 0.03) 0%, transparent 40%);
  color: var(--text-main);
  min-height: 100vh;
  line-height: 1.5;
  font-variant-numeric: tabular-nums;
}

.wrap {
  max-width: 1280px;
  margin: 0 auto;
  padding: 24px 20px 48px;
}

/* Header */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border-card);
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand-logo {
  width: 40px;
  height: 40px;
  background: linear-gradient(135deg, #f5c542 0%, #b48811 100%);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  box-shadow: 0 0 20px rgba(245, 197, 66, 0.25);
}
.brand-title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.02em;
  background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.brand-subtitle {
  font-size: 12px;
  color: var(--gold-primary);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.header-right {
  display: flex;
  align-items: center;
  gap: 16px;
}
.prof-badge {
  font-size: 13px;
  color: var(--text-muted);
  background: rgba(255, 255, 255, 0.04);
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid var(--border-card);
  display: flex;
  align-items: center;
  gap: 8px;
}
.prof-badge a {
  color: var(--gold-primary);
  text-decoration: none;
  font-weight: 600;
  transition: all 0.2s ease;
}
.prof-badge a:hover {
  text-shadow: 0 0 8px rgba(245, 197, 66, 0.5);
}

/* Stale Banner */
.stale {
  background: linear-gradient(90deg, rgba(239, 68, 68, 0.2) 0%, rgba(185, 28, 28, 0.3) 100%);
  border: 1px solid rgba(239, 68, 68, 0.4);
  color: #fca5a5;
  padding: 12px 20px;
  border-radius: 12px;
  margin-bottom: 20px;
  display: none;
  font-weight: 600;
  font-size: 14px;
  align-items: center;
  gap: 10px;
  animation: pulse-border 2s infinite;
}
@keyframes pulse-border {
  0%, 100% { border-color: rgba(239, 68, 68, 0.4); }
  50% { border-color: rgba(239, 68, 68, 0.8); }
}

/* Live Strip Grid */
.strip {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 28px;
}
.stat-card {
  background: var(--bg-card);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border-card);
  border-radius: 14px;
  padding: 16px 18px;
  transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  position: relative;
  overflow: hidden;
}
.stat-card:hover {
  transform: translateY(-2px);
  border-color: rgba(245, 197, 66, 0.3);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3), 0 0 12px var(--gold-glow);
}
.stat-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 6px;
}
.stat-value {
  font-size: 20px;
  font-weight: 700;
  color: var(--text-main);
  display: block;
}
.stat-sub {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
}

/* Section Cards */
.card-section {
  background: var(--bg-card);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border-card);
  border-radius: 16px;
  padding: 20px 24px;
  margin-bottom: 28px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
}
.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
h2 {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 8px;
}
h2::before {
  content: '';
  display: inline-block;
  width: 4px;
  height: 16px;
  background: var(--gold-primary);
  border-radius: 2px;
}

/* Equity Canvas */
.canvas-wrap {
  position: relative;
  width: 100%;
  height: 240px;
  border-radius: 12px;
  overflow: hidden;
  background: rgba(9, 13, 20, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.05);
}
canvas {
  width: 100%;
  height: 100%;
  display: block;
}

/* Chart panel: strategy tabs + expand toggle */
.chart-panel {
  position: relative;
}
.chart-panel.expanded {
  grid-column: 1 / -1;
}
.chart-panel.expanded .canvas-wrap {
  height: 60vh;
}
.tabs {
  display: flex;
  gap: 6px;
}
.tab-btn {
  background: rgba(255, 255, 255, 0.04);
  color: var(--text-muted);
  border: 1px solid var(--border-card);
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: none;
  transition: all 0.2s ease;
}
.tab-btn:hover {
  color: var(--text-main);
  transform: none;
  box-shadow: none;
}
.tab-btn.active {
  background: rgba(245, 197, 66, 0.15);
  color: var(--gold-primary);
  border-color: rgba(245, 197, 66, 0.4);
}
.expand-btn {
  position: absolute;
  right: 10px;
  bottom: 10px;
  width: 26px;
  height: 26px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.06);
  color: var(--text-muted);
  border: 1px solid var(--border-card);
  border-radius: 6px;
  font-size: 13px;
  line-height: 1;
  box-shadow: none;
  z-index: 5;
}
.expand-btn:hover {
  color: var(--text-main);
  background: rgba(255, 255, 255, 0.12);
  transform: none;
  box-shadow: none;
}

/* Custom Table Design */
.table-wrap {
  width: 100%;
  overflow-x: auto;
}
/* Scroll cap: shows ~8 rows of a log table, header pinned while the body
   scrolls -- row height derives from td's 12px v-padding + 13.5px/1.5
   line-height (~45px/row); header from th's 10px v-padding + 11px/1.5
   line-height (~38px). */
.table-wrap.scroll-cap {
  max-height: calc(8 * 45px + 38px);
  overflow-y: auto;
}
.table-wrap.scroll-cap thead th {
  position: sticky;
  top: 0;
  background: #10151f;
  z-index: 1;
}
table {
  border-collapse: collapse;
  width: 100%;
  font-size: 13.5px;
}
th {
  text-align: left;
  padding: 10px 14px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  background: rgba(255, 255, 255, 0.02);
}
td {
  padding: 12px 14px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.04);
  color: var(--text-main);
  vertical-align: middle;
}
tr:hover td {
  background: rgba(255, 255, 255, 0.02);
}

/* Badges & Buttons */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
}
.badge-pos { background: var(--pos-bg); color: var(--pos-green); border: 1px solid rgba(16, 185, 129, 0.3); }
.badge-neg { background: var(--neg-bg); color: var(--neg-red); border: 1px solid rgba(239, 68, 68, 0.3); }
.badge-gold { background: rgba(245, 197, 66, 0.15); color: var(--gold-primary); border: 1px solid rgba(245, 197, 66, 0.3); }
.badge-muted { background: rgba(255, 255, 255, 0.05); color: var(--text-muted); border: 1px solid rgba(255, 255, 255, 0.1); }

button {
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #fff;
  border: 0;
  border-radius: 6px;
  padding: 6px 14px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
}
button:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
}
button.btn-sm {
  padding: 4px 10px;
  font-size: 11px;
}
button.btn-cancel {
  background: rgba(239, 68, 68, 0.2);
  color: #fca5a5;
  border: 1px solid rgba(239, 68, 68, 0.3);
  box-shadow: none;
}
button.btn-cancel:hover {
  background: rgba(239, 68, 68, 0.3);
}

.pos { color: var(--pos-green); font-weight: 600; }
.neg { color: var(--neg-red); font-weight: 600; }

.thumb-img {
  height: 42px;
  border-radius: 6px;
  border: 1px solid var(--border-card);
  cursor: pointer;
  transition: transform 0.2s ease, border-color 0.2s ease;
}
.thumb-img:hover {
  transform: scale(1.08);
  border-color: var(--gold-primary);
  box-shadow: 0 0 10px rgba(245, 197, 66, 0.3);
}

/* Lightbox */
.lightbox-overlay {
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(8px);
  z-index: 9999;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.lightbox-content {
  max-width: 90vw;
  max-height: 90vh;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  box-shadow: 0 20px 50px rgba(0,0,0,0.8);
}
</style>
</head>
<body>

<div class="wrap">
  <!-- Header -->
  <header class="header">
    <div class="brand">
      <div class="brand-logo">🥇</div>
      <div>
        <h1 class="brand-title">XAU Assistant</h1>
        <div class="brand-subtitle">iziGold Trading Console</div>
      </div>
    </div>
    <div class="header-right">
      <span id="prof" class="prof-badge"></span>
    </div>
  </header>

  <!-- Heartbeat Stale Alert -->
  <div id="stale" class="stale">
    <span>⚠️</span> EA not reporting (heartbeat stale)
  </div>

  <!-- Control Bar -->
  <div class="card-section" style="padding:14px 18px;">
    <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;">
      <div style="display:flex;gap:6px;align-items:center;">
        <span class="stat-label" style="margin-right:4px;">Mode</span>
        <button id="mAuto" class="btn-sm" onclick="setMode('auto')">🤖 AUTO</button>
        <button id="mManual" class="btn-sm" onclick="setMode('manual')">👤 MANUAL</button>
      </div>
      <button id="closeAll" class="btn-sm btn-cancel" onclick="closeAllPos()">✖ Close all</button>
      <span id="ctlsub" class="stat-label"></span>
    </div>
    <div id="propcard"></div>
  </div>

  <!-- Live Metrics Strip -->
  <div class="strip" id="strip">
    <div class="stat-card">
      <div class="stat-label">System Status</div>
      <div class="stat-value">Connecting...</div>
    </div>
  </div>

  <!-- Equity Chart -->
  <div class="card-section chart-panel" id="pricePanel">
    <div class="section-header">
      <h2>XAUUSD — live</h2>
      <div class="tabs" id="stratTabs">
        <button type="button" class="tab-btn active" data-tab="halftrend_ema_v1" onclick="setTab('halftrend_ema_v1')">halftrend</button>
        <button type="button" class="tab-btn" data-tab="boll_stochrsi_v1" onclick="setTab('boll_stochrsi_v1')">boll_stochrsi</button>
      </div>
    </div>
    <div class="canvas-wrap" id="chartWrap">
      <div id="chartEl" style="width:100%;height:100%"></div>
    </div>
    <button type="button" id="expandBtn" class="expand-btn" onclick="toggleExpand()" title="Expand/collapse chart">⛶</button>
  </div>

  <!-- Strategy Matrix -->
  <div class="card-section">
    <div class="section-header">
      <h2>Strategy comparison</h2>
    </div>
    <div class="table-wrap">
      <table id="cmp"></table>
    </div>
  </div>

  <!-- Trade History -->
  <div class="card-section">
    <div class="section-header">
      <h2>Trade history</h2>
    </div>
    <div class="table-wrap scroll-cap">
      <table id="tr"></table>
    </div>
  </div>

  <!-- Signal Log -->
  <div class="card-section">
    <div class="section-header">
      <h2>Signal log</h2>
    </div>
    <div class="table-wrap scroll-cap">
      <table id="sig"></table>
    </div>
  </div>
</div>

<!-- Image Lightbox Modal -->
<div id="lightbox" class="lightbox-overlay" onclick="closeLightbox(event)">
  <img id="lightbox-img" class="lightbox-content" src="" alt="Enlarged chart" onerror="this.closest('.lightbox-overlay').style.display='none'">
</div>

<script>
const $=id=>document.getElementById(id);
const fmt=(v,d=2)=>v==null?"—":Number(v).toFixed(d);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function j(u){const r=await fetch(u);return r.json()}

function openLightbox(src){
  $('lightbox-img').src=src;
  $('lightbox').style.display='flex';
}
function closeLightbox(e){
  if(e.target===$('lightbox')||e.target===$('lightbox-img')) {
    $('lightbox').style.display='none';
  }
}

async function state(){
 const s=await j('/ui/state');
 $('stale').style.display=(s.age_s==null||s.age_s>30)?'flex':'none';
 // controls render even before the first heartbeat (mode/proposal are
 // service-side state, not EA state)
 const onCss='background:var(--gold-primary);color:#000;font-weight:600;';
 $('mAuto').style.cssText = s.mode==='auto'?onCss:'';
 $('mManual').style.cssText = s.mode==='manual'?onCss:'';
 renderProposal(s.proposal);
 const h=s.heartbeat;
 $('closeAll').disabled = !(h&&h.positions&&h.positions.length);
 $('ctlsub').textContent = (s.mode==='manual'?'EA proposes, you approve':'EA executes signals')
   + (h?` · spread ${fmt(h.spread_points,0)} pts`:'');
 if(!h) return;
 
 const posStr = h.positions && h.positions.length > 0 
  ? h.positions.map(p=>`<div style="font-size:12px;margin-top:2px;"><b>${p.direction}</b> ${fmt(p.lots,2)}@${fmt(p.open_price,2)} <span class="${p.profit>=0?'pos':'neg'}">$${fmt(p.profit,2)}</span></div>`).join('') 
  : '<span class="badge badge-muted">flat</span>';

 const killSwitchStatus = h.kill_switch 
  ? '<span class="badge badge-neg">⛔ TRIPPED</span>' 
  : (h.hwm>0 ? `<span class="badge badge-pos">ok</span> <span style="font-size:11px;color:var(--text-muted);">(${fmt(100*(h.equity/h.hwm-1),1)}% off peak)</span>` : '<span class="badge badge-pos">ok</span>');

 const pendingSwitch = s.pending_switch
  ? ` → ${esc(s.pending_switch)} <button class="btn-sm btn-cancel" onclick="sw('')">cancel</button>`
  : '';

 $('strip').innerHTML= `
  <div class="stat-card">
    <div class="stat-label">Equity</div>
    <div class="stat-value">$${fmt(h.equity,2)}</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Floating P/L</div>
    <div class="stat-value ${h.floating_pl>=0?'pos':'neg'}">${h.floating_pl>=0?'+':''}$${fmt(h.floating_pl,2)}</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Positions</div>
    <div class="stat-value" style="font-size:14px;font-weight:500;">${posStr}</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Active</div>
    <div class="stat-value" style="font-size:14px;color:var(--gold-primary);">${esc(h.active_strategy)}${pendingSwitch}</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Kill switch</div>
    <div class="stat-value" style="font-size:14px;">${killSwitchStatus}</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Window</div>
    <div class="stat-value" style="font-size:14px;"><span class="badge ${h.window_open?'badge-pos':'badge-muted'}">${h.window_open?'open':'closed'}</span></div>
    <div class="stat-sub">${h.exposure_min}m used</div>
  </div>
 `;

 fetch('/ui/profile').then(r=>r.json()).then(({profile,completion_pct})=>{
  const prof=$('prof');
  prof.textContent='';
  if(profile&&profile.name) prof.appendChild(document.createTextNode(profile.name+' · '));
  const a=document.createElement('a');
  a.href='/ui/onboarding';
  a.textContent=`profile ${completion_pct}%`;
  prof.appendChild(a);
 });
}

let chart=null,candleSeries=null,S={};        // S: overlay line series by key
let _activeTab='halftrend_ema_v1',_expanded=false,_pcData=null;

function initChart(){
 chart=LightweightCharts.createChart($('chartEl'),{
  layout:{background:{type:'solid',color:'rgba(9,13,20,0)'},textColor:'#94a3b8',
          fontFamily:'"Plus Jakarta Sans", system-ui, sans-serif'},
  grid:{vertLines:{color:'rgba(255,255,255,0.05)'},horzLines:{color:'rgba(255,255,255,0.05)'}},
  rightPriceScale:{borderColor:'rgba(255,255,255,0.08)'},
  timeScale:{borderColor:'rgba(255,255,255,0.08)',timeVisible:true,secondsVisible:false},
  crosshair:{mode:LightweightCharts.CrosshairMode.Normal},
  autoSize:true});
 // overlays first: later-added series paint on top, so candles stay above
 const noLbl={priceLineVisible:false,lastValueVisible:false};
 S.ema9=chart.addLineSeries(Object.assign({color:'#666',lineWidth:1},noLbl));
 S.ema21=chart.addLineSeries(Object.assign({color:'#666',lineWidth:1},noLbl));
 S.ema55=chart.addLineSeries(Object.assign({color:'#f5c542',lineWidth:2},noLbl));
 S.ema200=chart.addLineSeries(Object.assign({color:'mediumpurple',lineWidth:2},noLbl));
 S.ht=chart.addLineSeries(Object.assign({color:'dodgerblue',lineWidth:2},noLbl));
 S.bb_upper=chart.addLineSeries(Object.assign({color:'#7f8c9a',lineWidth:1},noLbl));
 S.bb_mid=chart.addLineSeries(Object.assign({color:'#7f8c9a',lineWidth:1,
   lineStyle:LightweightCharts.LineStyle.Dashed},noLbl));
 S.bb_lower=chart.addLineSeries(Object.assign({color:'#7f8c9a',lineWidth:1},noLbl));
 candleSeries=chart.addCandlestickSeries({upColor:'#2ecc71',downColor:'#e74c3c',
  borderUpColor:'#2ecc71',borderDownColor:'#e74c3c',
  wickUpColor:'#2ecc71',wickDownColor:'#e74c3c'});
}

function setLine(s,arr){
 if(!arr||!_pcData){s.setData([]);return;}
 s.setData(_pcData.candles.map((c,i)=>arr[i]==null?null:{time:c.t,value:arr[i]})
   .filter(Boolean));
}
function setHt(arr){
 if(!arr||!_pcData){S.ht.setData([]);return;}
 S.ht.setData(_pcData.candles.map((c,i)=>{
  const e=arr[i]; if(e==null) return null;
  return {time:c.t,value:e[0],color:e[1]===0?'dodgerblue':'orangered'};
 }).filter(Boolean));
}
function barSec(){const c=_pcData&&_pcData.candles;return c&&c.length>1?c[1].t-c[0].t:300;}
function barTime(candles,ts){
 // trade ts is service wall-clock; candle t is broker server time -- same
 // snap rule the old canvas chart used: first bar at/after ts, else last.
 const hit=candles.find(c=>c.t>=ts);
 return (hit||candles[candles.length-1]).t;
}
function buildMarkers(candles,tr){
 if(!candles.length) return [];
 const m=[];
 for(const t of tr){
  if(t.event==='open'||t.event==='add'){
   m.push({time:barTime(candles,t.ts),
    position:t.direction==='BUY'?'belowBar':'aboveBar',
    color:t.direction==='BUY'?'#2ecc71':'#e74c3c',
    shape:t.direction==='BUY'?'arrowUp':'arrowDown',
    text:(t.event==='add'?'add ':'')+fmt(t.lots,2)});
  }else if(t.event==='close'){
   m.push({time:barTime(candles,t.ts),position:'aboveBar',
    color:t.profit>=0?'#2ecc71':'#e74c3c',shape:'circle',
    text:(t.profit>=0?'+':'')+fmt(t.profit)});
  }
 }
 return m.sort((a,b)=>a.time-b.time);
}

async function priceChart(){
 if(!window.LightweightCharts){
  $('chartWrap').innerHTML='<div style="padding:20px;color:var(--text-muted)">chart library failed to load — the rest of the dashboard still works</div>';
  return;
 }
 if(!chart) initChart();
 const cd=await j('/ui/candles');
 let ov={},tr=[];
 try{ ov=await j('/ui/overlays?strategy='+encodeURIComponent(_activeTab)); }catch(e){}
 try{ tr=(await j('/ui/trades?limit=100')).trades||[]; }catch(e){}
 _pcData={candles:cd.candles,ov,tr};
 candleSeries.setData(cd.candles.map(c=>({time:c.t,open:c.o,high:c.h,low:c.l,close:c.c})));
 setLine(S.ema9,ov.ema9); setLine(S.ema21,ov.ema21);
 setLine(S.ema55,ov.ema55); setLine(S.ema200,ov.ema200);
 setHt(ov.halftrend);
 setLine(S.bb_upper,ov.bb_upper); setLine(S.bb_mid,ov.bb_mid);
 setLine(S.bb_lower,ov.bb_lower);
 candleSeries.setMarkers(buildMarkers(cd.candles,tr));
}

function setTab(t){
 _activeTab=t;
 document.querySelectorAll('#stratTabs .tab-btn').forEach(b=>
   b.classList.toggle('active', b.dataset.tab===t));
 priceChart();
}
function toggleExpand(){
 _expanded=!_expanded;
 $('pricePanel').classList.toggle('expanded', _expanded);   // autoSize refits
}
function zoomToTrade(ts){
 if(!chart||!_pcData||!_pcData.candles.length) return;
 const t=barTime(_pcData.candles,ts), span=90*barSec();
 chart.timeScale().setVisibleRange({from:t-span,to:t+span});
 $('pricePanel').scrollIntoView({behavior:'smooth',block:'start'});
}

async function stats(){
 const s=await j('/ui/stats');const rows=Object.entries(s.by_strategy||{});
 $('cmp').innerHTML='<thead><tr><th>strategy</th><th>signals</th><th>resolved</th><th>hit %</th><th>avg move</th><th></th></tr></thead><tbody>'+
  rows.map(([key,v])=>{
    // key is "<strategy_id> @<timeframe>" (display only) -- /ui/switch takes the
    // bare strategy_id, so strip the " @<tf>" suffix for the button's payload.
    const bareId=key.split(' @')[0];
    const btn=key==='pre-framework'?''
     :`<button class="btn-sm" data-sid="${esc(bareId)}">switch to this</button>`;
    return `<tr><td><b>${esc(key)}</b></td><td>${v.signals}</td><td>${v.resolved}</td>`
     +`<td><span class="badge ${v.hit_pct>=50?'badge-pos':'badge-neg'}">${fmt(v.hit_pct,1)}%</span></td>`
     +`<td>${fmt(v.avg_move)}</td><td>${btn}</td></tr>`;
  }).join('')+'</tbody>';
}
// Delegated listener: the "switch to this" buttons carry their target id in a
// data-attribute (never spliced into an onclick string) so a strategy_id
// containing HTML/JS-meaningful characters (strategy_id is unconstrained on
// /analyze, which must stay fail-open for EA posts) can't execute here.
$('cmp').addEventListener('click', e=>{
 const btn=e.target.closest('[data-sid]');
 if(btn) sw(btn.dataset.sid);
});

async function signals(){
 const {signals}=await j('/ui/signals');
 $('sig').innerHTML='<thead><tr><th>time</th><th>strategy</th><th>signal</th><th>AI</th><th>verdict</th><th>outcome</th></tr></thead><tbody>'+
  signals.map(s=>{
    const vBadge = s.verdict === 'CONFIRMED' ? 'badge-pos' : (s.verdict === 'VETO' ? 'badge-neg' : 'badge-gold');
    return `<tr><td>${new Date(s.created_ts*1000).toLocaleString()}</td><td><b>${esc(s.strategy_id||'—')}</b>${s.timeframe?' @'+esc(s.timeframe):''}${s.is_active?'':' <span class="badge badge-muted">(shadow)</span>'}</td>`+
    `<td><span class="badge ${s.signal==='BUY'?'badge-pos':(s.signal==='SELL'?'badge-neg':'badge-muted')}">${s.signal}</span></td>`+
    `<td>${s.direction} <span class="badge badge-gold">${fmt(100*s.confidence,0)}%</span></td>`+
    `<td><span class="badge ${vBadge}">${s.verdict}</span></td>`+
    `<td>${s.outcome_move==null?'<span style="color:var(--text-muted)">pending</span>':fmt(s.outcome_move)}</td></tr>`;
  }).join('')+'</tbody>';
}

async function trades(){
 const {trades}=await j('/ui/trades');
 $('tr').innerHTML='<thead><tr><th></th><th>time</th><th>event</th><th>strategy</th><th>direction</th><th>lots@price</th><th>P/L</th><th>reason</th><th>screenshot</th><th>render</th></tr></thead><tbody>'+
  trades.map(t=>{
   const pl=t.event==='close'?`<span class="${t.profit>=0?'pos':'neg'}">${t.profit>=0?'+':''}${fmt(t.profit)}</span>`:'';
   return `<tr><td><button class="btn-sm" onclick="zoomToTrade(${Number(t.ts)})" title="show on chart">📍</button></td>`+
    `<td>${new Date(t.ts*1000).toLocaleString()}</td><td><span class="badge ${t.event==='open'?'badge-pos':(t.event==='close'?'badge-gold':'badge-muted')}">${esc(t.event)}</span></td><td><b>${esc(t.strategy_id||'—')}</b></td><td>${esc(t.direction||'—')}</td>`+
    `<td>${fmt(t.lots,2)}@${fmt(t.price,2)}</td><td>${pl}</td><td><span style="font-size:12px;color:var(--text-muted);">${esc(t.reason||'—')}</span></td>`+
    `<td><img src="/ui/screenshot/${t.id}" class="thumb-img" height="40" onerror="this.style.display='none'" onclick="openLightbox(this.src)"></td>`+
    `<td><img src="/ui/render/${t.id}" class="thumb-img" height="40" onerror="this.style.display='none'" onclick="openLightbox(this.src)"></td></tr>`;
  }).join('')+'</tbody>';
}

function renderProposal(p){
 const el=$('propcard');
 if(!p){el.innerHTML='';return;}
 const badge=p.status==='pending'?'badge-gold':(p.status==='executed'?'badge-pos':(p.status==='blocked'?'badge-neg':'badge-muted'));
 // p.id is server-generated INTEGER; Number() keeps the onclick splice safe.
 const btns=p.status==='pending'
  ?`<button class="btn-sm" onclick="decide(${Number(p.id)},'take')">🟢 Take trade</button>
    <button class="btn-sm btn-cancel" onclick="decide(${Number(p.id)},'skip')">🔴 Skip</button>`
  :'';
 el.innerHTML=`<div style="margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
  <span>${p.kind==='entry'?'📥':'📤'} <b>${esc(p.direction)}</b> @ ${fmt(p.price)}
   · ${esc(p.strategy_id||'')} · <span class="badge ${badge}">${esc(p.status)}</span></span>${btns}</div>`;
}

async function setMode(m){
 const r=await fetch('/ui/mode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:m})});
 if(!r.ok) alert('Mode change failed ('+r.status+')');
 state();
}

async function decide(pid,action){
 const r=await fetch('/ui/proposal/'+pid,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})});
 if(r.ok){const d=await r.json(); if(!d.ok) alert('Already decided elsewhere: '+d.status);}
 else alert('Decision failed ('+r.status+')');
 state();
}

async function closeAllPos(){
 if(!confirm('Close ALL open positions?')) return;
 const r=await fetch('/ui/close-all',{method:'POST'});
 if(!r.ok){const d=await r.json().catch(()=>({})); alert('Close-all failed: '+(d.detail||r.status));}
 state();
}

async function sw(id){
 try{
   const r=await fetch('/ui/switch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({strategy_id:id})});
   if(!r.ok){
     const detail=await r.text().catch(()=>'');
     alert(`Switch request failed (${r.status}): ${detail||'see server log'}`);
   }
 }catch(e){
   alert('Switch request failed: '+e);
 }
 state();
}

state();priceChart();stats();signals();trades();
setInterval(state,5000);setInterval(priceChart,30000);setInterval(stats,30000);setInterval(signals,30000);setInterval(trades,30000);
</script>
</body>
</html>
