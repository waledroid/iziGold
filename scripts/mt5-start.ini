; MT5 startup config used by launch.py and the watchdog's MT5 restart:
; force algo trading ON and auto-attach the EA at every launch.
;
; WebRequest allowlist: DO NOT add `WebRequest=`/`WebRequestUrl=` here. That
; MT4-era command-line override configures the [StartUp] chart, NOT the security
; whitelist, which MetaQuotes keeps GUI-only and stores obfuscated in
; `Config/settings.ini` (written only on a clean exit). It was tried and did
; nothing. Set it ONCE in Tools > Options > Expert Advisors, close MT5 via
; scripts/stop-mt5.sh (graceful, so settings flush), then snapshot it with
; scripts/mt5-settings.sh backup so a lost allowlist can be restored in seconds.
;
; [StartUp] loads the Default profile on boot. The Default profile is
; pre-provisioned by launch.py to open strictly two charts:
; chart01 = XAUUSD (M15) with iziBot attached
; chart02 = BTCUSD (M5) with iziBot attached
; No standalone Symbol/Period/Expert keys are set here to prevent MT5 from
; spawning an extra duplicate chart on top of the profile.
[Experts]
Enabled=1
[StartUp]
Profile=Default
